<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Monastir International Airport - Connexion</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#f7f9fb",
                        "on-tertiary-container": "#75859d",
                        "outline-variant": "#c6c6cd",
                        "surface-bright": "#f7f9fb",
                        "on-tertiary-fixed-variant": "#38485d",
                        "on-secondary-container": "#004d6a",
                        "secondary-container": "#40c2fd",
                        "secondary-fixed": "#c4e7ff",
                        "outline": "#76777d",
                        "primary": "#000000",
                        "surface-variant": "#e0e3e5",
                        "tertiary-container": "#0b1c30",
                        "on-secondary-fixed-variant": "#004c69",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "on-background": "#191c1e",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#191c1e",
                        "on-error": "#ffffff",
                        "tertiary": "#000000",
                        "background": "#f7f9fb",
                        "surface-tint": "#565e74",
                        "surface-container-high": "#e6e8ea",
                        "error-container": "#ffdad6",
                        "surface-dim": "#d8dadc",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#dae2fd",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "primary-fixed-dim": "#bec6e0",
                        "tertiary-fixed": "#d3e4fe",
                        "on-secondary-fixed": "#001e2c",
                        "on-tertiary-fixed": "#0b1c30",
                        "surface-container-low": "#f2f4f6",
                        "secondary-fixed-dim": "#7bd0ff",
                        "surface-container": "#eceef0",
                        "surface-container-highest": "#e0e3e5",
                        "on-primary-fixed-variant": "#3f465c",
                        "primary-container": "#131b2e",
                        "on-primary-fixed": "#131b2e",
                        "inverse-primary": "#bec6e0",
                        "on-primary-container": "#7c839b",
                        "secondary": "#00668a",
                        "on-surface-variant": "#45464d",
                        "inverse-surface": "#2d3133",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#eff1f3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "widget-padding": "20px",
                        "section-gap": "32px",
                        "unit": "4px",
                        "container-margin": "24px"
                    },
                    "fontFamily": {
                        "data-mono": ["JetBrains Mono"],
                        "body-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body-lg h-screen w-screen overflow-hidden relative flex items-center justify-center">
<!-- Background Image -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center" style="background-image: url('https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg');"></div>
<div class="absolute inset-0 bg-primary/40 backdrop-blur-[2px]"></div> <!-- Dark overlay for contrast -->
</div>
<!-- Login Card (Glassmorphism) -->
<main class="relative z-10 w-full max-w-md px-container-margin">
<div class="bg-surface-container-lowest/80 backdrop-blur-xl rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-surface-container-highest/50 p-[32px] flex flex-col gap-[32px]">
<!-- Header / Logo Area -->
<div class="flex flex-col items-center gap-[12px] text-center">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[32px] text-on-primary" style="font-variation-settings: 'FILL' 1;">flight_takeoff</span>
</div>
<div>
<h1 class="font-headline-md text-headline-md text-primary">Monastir Airport</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Operations Intelligence</p>
</div>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-[24px]">
<div class="flex flex-col gap-[16px]">
<!-- Email Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-[8px] uppercase" for="email">Adresse Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full pl-10 pr-3 py-[10px] bg-surface border border-outline-variant rounded focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline" id="email" placeholder="nom@aeroport-monastir.tn" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-[8px]">
<label class="block font-label-caps text-label-caps text-on-surface uppercase" for="password">Mot de passe</label>
<a class="font-body-sm text-body-sm text-secondary hover:text-primary transition-colors" href="#">Mot de passe oublié ?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full pl-10 pr-3 py-[10px] bg-surface border border-outline-variant rounded focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-secondary focus:ring-secondary bg-surface" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                        Se souvenir de moi
                    </label>
</div>
<!-- Submit Action -->
<button class="w-full flex justify-center items-center py-[12px] px-4 border border-transparent rounded bg-primary-container text-on-primary hover:bg-tertiary-container hover:shadow-md transition-all duration-200 font-headline-sm text-headline-sm" type="submit">
                    Se connecter
                </button>
</form>
<!-- Footer Note -->
<div class="text-center font-body-sm text-body-sm text-on-surface-variant mt-[-8px]">
<p>Accès restreint au personnel autorisé.</p>
</div>
</div>
</main>
</body></html>
